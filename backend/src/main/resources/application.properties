# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:chatdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Application Name
spring.application.name=accordion-chat

# CORS Configuration
# For production, replace with specific origins (e.g., https://yourdomain.com)
app.cors.allowed-origins=*

# Message Content Validation
app.message.max-length=1000

# Username Validation
app.username.max-length=50
app.username.min-length=3

# Password Validation
app.password.min-length=8

# JWT Configuration
# SECURITY WARNING: Never commit a default here. The placeholder below has no default
# value, so an absent JWT_SECRET makes startup fail with an unresolvable-placeholder
# error. JwtUtil additionally rejects a blank secret or one shorter than the 32 bytes
# HS256 requires. Generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (24 hours)
jwt.expiration=86400000

# The backend's own version, baked in from pom.xml by Maven resource filtering.
accordion.version=@project.version@

# Usage Reporting (https://github.com/Stephenson-Software/trace)
# Once the backend is ready it sends a single "startup" event carrying the program name
# (accordion) and the version above, and a "channel-created" event (program name only) each
# time a channel is created through the API -- nothing about users, messages, channel names or
# the host. The send runs on its own daemon thread and never throws or blocks startup. One INFO
# line at every start says whether it is on. Turn it off with USAGE_REPORTING_ENABLED=false.
usage-reporting.enabled=${USAGE_REPORTING_ENABLED:true}
usage-reporting.endpoint=${USAGE_REPORTING_ENDPOINT:https://trace.danielstephenson.dev}
usage-reporting.key=${USAGE_REPORTING_KEY:9FLv2WEcLl_qzS75yfU__up46jP5NnxDM7THjr9wMEc}
